name: CI/CD Build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate short SHA
        id: set-short-sha
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleStandardRelease

      - name: Sign APKs
        run: |
          set -e
          STANDARD_RELEASE_DIR="app/build/outputs/apk/standard/release"
          
          if [ -z "${{ secrets.MPVRXN_KEYSTORE_BASE64 }}" ]; then
            echo "MPVRXN_KEYSTORE_BASE64 secret is not available. Skipping signing step."
            exit 0
          fi
          
          echo "${{ secrets.MPVRXN_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          
          find "$STANDARD_RELEASE_DIR" -name "app-standard-*-release-unsigned.apk" -type f | while read -r apk; do
            signed_apk="${apk/-unsigned/}"
          
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks release.keystore \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.STORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$signed_apk" \
              "$apk"
          
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify "$signed_apk"
            rm "$apk"
          done
          
          rm release.keystore
          echo "APKs signed and verified successfully."

      - name: Rename APKs to MpvRxN
        run: |
          STANDARD_RELEASE_DIR="app/build/outputs/apk/standard/release"
          for apk in "$STANDARD_RELEASE_DIR"/app-standard-*-release.apk; do
            new_name=$(echo "$apk" | sed 's/app-standard/MpvRxN/g' | sed 's/-release//g')
            mv "$apk" "$new_name"
          done

      - name: Upload app-arm64-v8a Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MpvRxN-arm64-v8a
          path: app/build/outputs/apk/standard/release/MpvRxN-arm64-v8a.apk
          if-no-files-found: warn

      - name: Upload app-armeabi-v7a Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MpvRxN-armeabi-v7a
          path: app/build/outputs/apk/standard/release/MpvRxN-armeabi-v7a.apk
          if-no-files-found: warn
